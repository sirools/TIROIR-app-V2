# Stack de preprod Tiroir — NAS UGREEN DXP2800 (UGOS Pro + Docker)
# Déployé dans /volume1/docker/tiroir-preprod/ (adapter le volume si besoin).
#
#   web     -> nginx : sert le hello world, les sites statiques, et proxy /tiroir -> app
#   drive   -> filebrowser : explorateur de fichiers web du NAS
#   tiroir  -> l'app Next.js de Tiroir (front + routes API), branchée sur le Supabase de PREPROD
#
# Démarrage : docker compose up -d --build

services:
  web:
    image: nginx:1.27-alpine
    container_name: tiroir-preprod-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  drive:
    image: filebrowser/filebrowser:v2
    container_name: tiroir-preprod-drive
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./web:/srv
      - ./filebrowser/database.db:/database.db
      - ./filebrowser/settings.json:/config/settings.json

  tiroir:
    build:
      context: ./tiroir
      dockerfile: Dockerfile
      args:
        # Inlinés dans le bundle client au build (doivent être présents ici).
        # deploy.sh source ./tiroir/.env.preprod avant `docker compose build`.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: tiroir-preprod-app:latest
    container_name: tiroir-preprod-app
    restart: unless-stopped
    expose:
      - "8151"            # exposé au réseau interne du compose ; nginx fait le proxy
    ports:
      - "8151:8151"       # accès direct optionnel http://IP:8151
    env_file:
      - ./tiroir/.env.preprod   # valeurs de PREPROD uniquement (jamais la prod)
    environment:
      - NODE_ENV=production
      - PORT=8151
