<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tiroir · Preprod</title>
  <style>
    :root {
      --bg: #efe6da;
      --wood: #6b4a2b;
      --wood-soft: #8a6a45;
      --ink: #33261a;
      --card: #fbf6ef;
      --accent: #c8763c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: radial-gradient(120% 120% at 50% 0%, #f6efe4 0%, var(--bg) 60%, #e4d6c4 100%);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: var(--card); border: 1px solid #e0d2bf; border-radius: 20px;
      max-width: 560px; width: 100%; padding: 40px 36px;
      box-shadow: 0 18px 50px rgba(80,55,30,.18);
      text-align: center;
    }
    .badge {
      display: inline-block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--wood-soft); border: 1px solid #d8c6ad; border-radius: 999px;
      padding: 6px 14px; margin-bottom: 22px;
    }
    h1 { margin: 0 0 8px; font-size: 34px; color: var(--wood); }
    p { margin: 0 0 8px; line-height: 1.55; color: #5a4630; }
    .env { font-weight: 600; color: var(--accent); }
    .links { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a.btn {
      text-decoration: none; color: #fff; background: var(--wood);
      padding: 12px 20px; border-radius: 12px; font-weight: 600; font-size: 15px;
      transition: transform .12s ease, background .12s ease;
    }
    a.btn:hover { background: var(--wood-soft); transform: translateY(-1px); }
    a.ghost { background: transparent; color: var(--wood); border: 1px solid #cbb593; }
    .foot { margin-top: 26px; font-size: 12px; color: #9a866c; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Environnement de preprod</span>
    <h1>Hello, Tiroir 👋</h1>
    <p>Ce serveur tourne sur le <strong>NAS Synology</strong> et sert d'espace de
       <span class="env">preprod</span> avant l'envoi en production.</p>
    <p>Prochaines versions à valider ici : <strong>V4 · V5 · V6</strong>.</p>
    <div class="links">
      <a class="btn" id="drive" href="#">📁 Ouvrir le drive (fichiers)</a>
      <a class="btn ghost" id="tiroir" href="#">Voir la preprod Tiroir</a>
    </div>
    <p class="foot" id="stamp"></p>
  </main>
  <script>
    // Le drive et l'app tournent sur d'autres ports du même NAS
    var h = location.hostname;
    document.getElementById('drive').href  = location.protocol + '//' + h + ':8081/';
    document.getElementById('tiroir').href = location.protocol + '//' + h + ':8151/';
    document.getElementById('stamp').textContent =
      'Servi le ' + new Date().toLocaleString('fr-FR') + ' · ' + location.host;
  </script>
</body>
</html>
