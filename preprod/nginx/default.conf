server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Accueil -> hello world
    location = / {
        return 302 /hello/;
    }

    location /hello/ {
        try_files $uri $uri/ /hello/index.html;
    }

    # Preprod Tiroir : accès direct sur le port 8151 (http://IP:8151).
    # Un proxy sur sous-chemin /tiroir/ nécessiterait basePath:'/tiroir' dans
    # next.config.js (sinon les assets cassent) — on garde l'accès par port dédié.

    location / {
        try_files $uri $uri/ =404;
    }
}
