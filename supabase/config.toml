
# L'appelant est pg_cron, pas un utilisateur. La verification JWT ne
# protegerait rien ici : une cle anon est un JWT valide, n'importe qui
# pourrait donc declencher une fonction qui expedie du courrier.
# L'authentification se fait par secret partage, compare en base.
[functions.send-lifecycle-emails]
verify_jwt = false

# Resend n'envoie pas de JWT Supabase : le portier JWT rejetterait tous
# les evenements avant meme que la fonction les voie. L'authentification
# se fait par signature Svix, verifiee dans la fonction.
[functions.resend-webhook]
verify_jwt = false

# RevenueCat n'envoie pas de JWT Supabase. Avec la verification JWT, il
# fallait mettre un JWT (la cle anon, publique) comme secret du webhook :
# n'importe qui pouvait alors forger un achat. L'authentification se fait
# par secret partage, long et aleatoire (_shared/webhookAuth.ts).
[functions.revenuecat-webhook]
verify_jwt = false
